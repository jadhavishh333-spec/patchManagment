<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Audit Logs')}"></head>
<body class="app-layout">
<div th:replace="~{layout :: demo-banner}"></div>
<div th:replace="~{layout :: sidebar}"></div>
<main class="main-content">
    <div th:replace="~{layout :: topbar('Audit Logs')}"></div>
    <div class="content-body">
        <div th:replace="~{layout :: alerts}"></div>
        <div class="card">
            <div class="card-header">
                <h2 class="card-title"><i class="fas fa-clipboard-list me-2"></i>System Audit Log</h2>
                <a th:href="@{/reports/export/audit-csv}" class="btn btn-ghost btn-sm">
                    <i class="fas fa-download me-2"></i>Export CSV
                </a>
            </div>
            <div class="card-body p-0">
                <table class="data-table">
                    <thead>
                        <tr><th>Action</th><th>Entity</th><th>ID</th><th>Details</th><th>Performed By</th><th>Time</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs.content}" class="table-row-hover">
                            <td><span class="env-tag" th:text="${log.action}"></span></td>
                            <td th:text="${log.entityType}"></td>
                            <td th:text="${log.entityId ?: '—'}"></td>
                            <td><small th:text="${log.details}"></small></td>
                            <td th:text="${log.performedBy != null ? log.performedBy.username : 'SYSTEM'}"></td>
                            <td><small th:text="${#temporals.format(log.performedAt,'dd-MMM-yyyy HH:mm')}"></small></td>
                        </tr>
                        <tr th:if="${logs.content.isEmpty()}">
                            <td colspan="6" class="empty-state">No audit logs yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div th:if="${logs.totalPages > 1}" style="display:flex;gap:12px;align-items:center;margin-top:16px;justify-content:center">
            <a th:if="${currentPage > 0}" th:href="@{/admin/audit-logs(page=${currentPage - 1})}" class="btn btn-ghost btn-sm">
                <i class="fas fa-chevron-left"></i> Prev
            </a>
            <span class="text-muted" th:text="'Page ' + (${currentPage + 1}) + ' of ' + ${logs.totalPages}"></span>
            <a th:if="${currentPage < logs.totalPages - 1}" th:href="@{/admin/audit-logs(page=${currentPage + 1})}" class="btn btn-ghost btn-sm">
                Next <i class="fas fa-chevron-right"></i>
            </a>
        </div>
    </div>
    <div th:replace="~{layout :: footer}"></div>
</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
