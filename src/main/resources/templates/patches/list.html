<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Patches')}"></head>
<body class="app-layout">
<div th:replace="~{layout :: demo-banner}"></div>
<div th:replace="~{layout :: sidebar}"></div>
<main class="main-content">
    <div th:replace="~{layout :: topbar('Patch Catalog')}"></div>
    <div class="content-body">
        <div th:replace="~{layout :: alerts}"></div>
        <div class="page-actions">
            <a th:href="@{/patches/new}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
                <i class="fas fa-plus me-2"></i>Add Patch
            </a>
        </div>
        <div class="card">
            <div class="card-header">
                <h2 class="card-title"><i class="fas fa-shield-virus me-2"></i>Patch Catalog</h2>
                <span class="text-muted" th:text="${#lists.size(patches)} + ' patches'"></span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Patch ID</th><th>Title</th><th>OS</th><th>Severity</th>
                                <th>Reboot</th><th>Release Date</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${patches}" class="table-row-hover">
                                <td><span class="patch-id" th:text="${p.patchId}"></span></td>
                                <td>
                                    <span class="fw-600" th:text="${p.title}"></span>
                                    <small class="text-muted d-block"
                                           th:if="${p.description}"
                                           th:text="${#strings.abbreviate(p.description, 80)}"></small>
                                </td>
                                <td>
                                    <span th:if="${p.osType.name() == 'WINDOWS'}" class="os-badge os-win">
                                        <i class="fab fa-windows me-1"></i>Windows</span>
                                    <span th:if="${p.osType.name() == 'LINUX'}" class="os-badge os-linux">
                                        <i class="fab fa-linux me-1"></i>Linux</span>
                                </td>
                                <td>
                                    <span class="severity-badge"
                                          th:classappend="'sev-' + ${p.severity.name().toLowerCase()}"
                                          th:text="${p.severity}"></span>
                                </td>
                                <td>
                                    <span th:if="${p.requiresReboot}" class="badge-warn">
                                        <i class="fas fa-triangle-exclamation me-1"></i>Yes</span>
                                    <span th:unless="${p.requiresReboot}" class="badge-ok">No</span>
                                </td>
                                <td>
                                    <small th:if="${p.releaseDate}"
                                           th:text="${#temporals.format(p.releaseDate,'dd-MMM-yyyy')}"></small>
                                    <small th:unless="${p.releaseDate}" class="text-muted">—</small>
                                </td>
                                <td class="action-cell">
                                    <a th:href="@{/patches/{id}/edit(id=${p.id})}" class="btn-icon" title="Edit"
                                       sec:authorize="hasRole('ADMIN')">
                                        <i class="fas fa-pen"></i>
                                    </a>
                                    <a th:href="@{/jobs/new(patchId=${p.id})}" class="btn-icon btn-icon-success"
                                       title="Create job with this patch">
                                        <i class="fas fa-play"></i>
                                    </a>
                                    <form th:action="@{/patches/{id}/delete(id=${p.id})}" method="post"
                                          class="d-inline" sec:authorize="hasRole('ADMIN')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn-icon btn-icon-danger" title="Delete"
                                                onclick="return confirm('Delete this patch?')">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(patches)}">
                                <td colspan="7" class="empty-state">
                                    No patches in catalog. <a th:href="@{/patches/new}">Add one now</a>.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout :: footer}"></div>
</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
