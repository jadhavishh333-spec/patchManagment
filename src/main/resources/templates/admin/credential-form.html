<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Credential Mapping Form')}"></head>
<body class="app-layout">
<div th:replace="~{layout :: demo-banner}"></div>
<div th:replace="~{layout :: sidebar}"></div>
<main class="main-content">
    <div th:replace="~{layout :: topbar('Credential Mapping')}"></div>
    <div class="content-body">
        <div class="page-actions">
            <a th:href="@{/admin/credentials}" class="btn btn-ghost"><i class="fas fa-arrow-left me-2"></i>Back</a>
        </div>
        <div class="card form-card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-key me-2"></i>
                    <span th:text="${mapping.id != null} ? 'Edit Credential Mapping' : 'New Credential Mapping'"></span>
                </h2>
            </div>
            <div class="card-body">

                <!-- Validation / service-level errors -->
                <div class="alert alert-danger mb-4" th:if="${error}">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}"></span>
                </div>

                <!-- ── LOCAL SSH MODE banner ──────────────────────────────── -->
                <div class="alert alert-warning mb-4" th:if="${localMode}">
                    <i class="fas fa-terminal me-2"></i>
                    <strong>Local SSH Mode</strong> — SSH password is <strong>AES-256 encrypted</strong> before storage.
                    Suitable for dev/test. Use CyberArk for production.
                </div>

                <!-- ── CYBERARK MODE banner ──────────────────────────────── -->
                <div class="alert alert-info mb-4" th:unless="${localMode}">
                    <i class="fas fa-lock me-2"></i>
                    Passwords are <strong>never stored</strong>. Only the CyberArk Safe/Object identifiers are saved here.
                </div>

                <form th:action="${mapping.id != null} ? @{/admin/credentials/{id}/edit(id=${mapping.id})} : @{/admin/credentials/new}"
                      th:object="${mapping}" method="post" class="enterprise-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- Server selector (always shown) -->
                    <div class="form-group">
                        <label class="form-label">Server <span class="required">*</span></label>
                        <select th:field="*{serverId}" class="form-control" th:disabled="${mapping.id != null}">
                            <option value="">Select server…</option>
                            <option th:each="s : ${servers}" th:value="${s.id}"
                                    th:text="${s.name} + ' (' + ${s.ipAddress} + ')'"></option>
                        </select>
                        <input th:if="${mapping.id != null}" type="hidden" th:field="*{serverId}"/>
                    </div>

                    <!-- ══════════════════════════════════════════════════════ -->
                    <!-- LOCAL SSH MODE FIELDS                                  -->
                    <!-- ══════════════════════════════════════════════════════ -->
                    <div th:if="${localMode}">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">SSH Username <span class="required">*</span></label>
                                <input type="text" th:field="*{sshUsername}" class="form-control"
                                       placeholder="e.g. root or patchuser" autocomplete="off"/>
                            </div>
                            <div class="form-group">
                                <label class="form-label">
                                    SSH Password <span class="required">*</span>
                                    <span th:if="${mapping.id != null}" class="text-muted" style="font-size:0.8em">
                                        (leave blank to keep existing)
                                    </span>
                                </label>
                                <div style="position:relative;">
                                    <input type="password" th:field="*{sshPassword}" class="form-control"
                                           id="sshPasswordInput"
                                           placeholder="SSH password"
                                           autocomplete="new-password"/>
                                    <button type="button" class="btn btn-ghost btn-sm"
                                            style="position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:2px 8px;"
                                            onclick="togglePwd()">
                                        <i class="fas fa-eye" id="pwdEyeIcon"></i>
                                    </button>
                                </div>
                                <small class="text-muted">Stored AES-256-GCM encrypted. Never transmitted in plain text.</small>
                            </div>
                        </div>
                    </div>

                    <!-- ══════════════════════════════════════════════════════ -->
                    <!-- CYBERARK MODE FIELDS                                   -->
                    <!-- ══════════════════════════════════════════════════════ -->
                    <div th:unless="${localMode}">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">CyberArk Safe <span class="required">*</span></label>
                                <input type="text" th:field="*{cyberArkSafe}" class="form-control"
                                       placeholder="e.g. PatchMgmtSafe"/>
                            </div>
                            <div class="form-group">
                                <label class="form-label">CyberArk Object <span class="required">*</span></label>
                                <input type="text" th:field="*{cyberArkObject}" class="form-control"
                                       placeholder="e.g. WEB-PROD-01-admin"/>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Username (CyberArk)</label>
                                <input type="text" th:field="*{cyberArkUsername}" class="form-control"
                                       placeholder="e.g. Administrator (optional)"/>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Environment</label>
                                <input type="text" th:field="*{environment}" class="form-control"
                                       placeholder="PROD / DEV / STAGING (optional)"/>
                            </div>
                        </div>
                    </div>

                    <!-- Environment field for local mode -->
                    <div class="form-group" th:if="${localMode}">
                        <label class="form-label">Environment</label>
                        <input type="text" th:field="*{environment}" class="form-control"
                               placeholder="PROD / DEV / STAGING (optional)"/>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Notes</label>
                        <textarea th:field="*{notes}" class="form-control" rows="2"
                                  placeholder="Optional notes about this credential mapping"></textarea>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/admin/credentials}" class="btn btn-ghost">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Save Mapping
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:replace="~{layout :: footer}"></div>
</main>
<div th:replace="~{layout :: scripts}"></div>
<script>
function togglePwd() {
    const input = document.getElementById('sshPasswordInput');
    const icon  = document.getElementById('pwdEyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>
</body>
</html>
