<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('New Patch Job')}"></head>
<body class="app-layout">
<div th:replace="~{layout :: demo-banner}"></div>
<div th:replace="~{layout :: sidebar}"></div>
<main class="main-content">
    <div th:replace="~{layout :: topbar('New Patch Job')}"></div>
    <div class="content-body">
        <div class="page-actions">
            <a th:href="@{/jobs}" class="btn btn-ghost"><i class="fas fa-arrow-left me-2"></i>Back to Jobs</a>
        </div>

        <div class="card form-card">
            <div class="card-header">
                <h2 class="card-title"><i class="fas fa-plus-circle me-2"></i>Create New Patch Job</h2>
            </div>
            <div class="card-body">
                <form th:action="@{/jobs/new}" th:object="${job}" method="post" class="enterprise-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-group">
                        <label class="form-label">Job Title <span class="required">*</span></label>
                        <input type="text" th:field="*{title}" class="form-control"
                               placeholder="e.g. Apply Critical Security Patch to PROD servers"/>
                        <div class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Target Server <span class="required">*</span></label>
                            <select th:field="*{serverId}" class="form-control" id="serverSelect">
                                <option value="">Select a server…</option>
                                <option th:each="s : ${servers}" th:value="${s.id}"
                                        th:text="${s.name} + ' (' + ${s.ipAddress} + ') [' + ${s.osType} + '] ' + (${s.environment} != null ? '— ' + ${s.environment} : '')">
                                </option>
                            </select>
                            <div class="form-error" th:if="${#fields.hasErrors('serverId')}" th:errors="*{serverId}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Patch <span class="required">*</span></label>
                            <select th:field="*{patchId}" class="form-control" id="patchSelect">
                                <option value="">Select a patch…</option>
                                <option th:each="p : ${patches}" th:value="${p.id}"
                                        th:text="${p.patchId} + ' — ' + ${p.title} + ' [' + ${p.severity} + ']'">
                                </option>
                            </select>
                            <div class="form-error" th:if="${#fields.hasErrors('patchId')}" th:errors="*{patchId}"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Scheduled At (optional)</label>
                        <input type="datetime-local" th:field="*{scheduledAt}" class="form-control"/>
                        <small style="color:var(--text-muted);font-size:12px;margin-top:4px;display:block">
                            Leave blank to execute manually after approval, or set a time for automated execution.
                        </small>
                    </div>

                    <div class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        <strong>Workflow:</strong> After creating, an Admin must approve the job before it can be executed.
                        <span th:if="${demoMode}"> In demo mode, execution is simulated — no real server connections are made.</span>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/jobs}" class="btn btn-ghost">Cancel</a>
                        <button type="submit" class="btn btn-primary" id="createJobBtn">
                            <i class="fas fa-plus me-2"></i>Create Job
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:replace="~{layout :: footer}"></div>
</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
