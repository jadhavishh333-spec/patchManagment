<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Maintenance Window Form')}"></head>
<body class="app-layout">
<div th:replace="~{layout :: demo-banner}"></div>
<div th:replace="~{layout :: sidebar}"></div>
<main class="main-content">
    <div th:replace="~{layout :: topbar('Maintenance Window')}"></div>
    <div class="content-body">
        <div class="page-actions">
            <a th:href="@{/maintenance}" class="btn btn-ghost"><i class="fas fa-arrow-left me-2"></i>Back</a>
        </div>
        <div class="card form-card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-calendar-plus me-2"></i>
                    <span th:text="${window.id != null} ? 'Edit Window' : 'New Maintenance Window'"></span>
                </h2>
            </div>
            <div class="card-body">
                <form th:action="${window.id != null} ? @{/maintenance/{id}/edit(id=${window.id})} : @{/maintenance/new}"
                      th:object="${window}" method="post" class="enterprise-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Window Name <span class="required">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. PROD Saturday Window"/>
                            <div class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Window Type <span class="required">*</span></label>
                            <select th:field="*{windowType}" class="form-control">
                                <option value="">Select type…</option>
                                <option th:each="t : ${windowTypes}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea th:field="*{description}" class="form-control" rows="2" placeholder="Optional description"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Start Time <span class="required">*</span></label>
                            <input type="time" th:field="*{startTime}" class="form-control"/>
                        </div>
                        <div class="form-group">
                            <label class="form-label">End Time <span class="required">*</span></label>
                            <input type="time" th:field="*{endTime}" class="form-control"/>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Day of Week (for WEEKLY)</label>
                            <select th:field="*{dayOfWeek}" class="form-control">
                                <option value="">Any day</option>
                                <option th:each="d : ${daysOfWeek}" th:value="${d}" th:text="${d}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Environment</label>
                            <input type="text" th:field="*{environment}" class="form-control"
                                   placeholder="PROD / DEV / STAGING (blank = all)"/>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Start Date (for ONE_TIME)</label>
                            <input type="date" th:field="*{startDate}" class="form-control"/>
                        </div>
                        <div class="form-group">
                            <label class="form-label">End Date (for ONE_TIME)</label>
                            <input type="date" th:field="*{endDate}" class="form-control"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-check-label">
                            <input type="checkbox" th:field="*{active}" class="form-check-input"/>
                            Active
                        </label>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/maintenance}" class="btn btn-ghost">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Save Window
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:replace="~{layout :: footer}"></div>
</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
