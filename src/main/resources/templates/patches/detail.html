<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Patch Detail')}"></head>
<body class="app-layout">
<div th:replace="~{layout :: demo-banner}"></div>
<div th:replace="~{layout :: sidebar}"></div>
<main class="main-content">
    <div th:replace="~{layout :: topbar('Patch Detail')}"></div>
    <div class="content-body">
        <div th:replace="~{layout :: alerts}"></div>

        <div class="page-actions">
            <a th:href="@{/patches}" class="btn btn-ghost"><i class="fas fa-arrow-left me-2"></i>Back to Patches</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/patches/{id}/edit(id=${patch.id})}" class="btn btn-primary">
                <i class="fas fa-pen me-2"></i>Edit Patch
            </a>
            <a th:href="@{/jobs/new}" class="btn btn-success">
                <i class="fas fa-play me-2"></i>Create Patch Job
            </a>

            <!-- Deletion pending notice -->
            <span th:if="${deletionPending}" class="badge-warn" style="padding:0.45rem 0.9rem;font-size:0.8rem;">
                <i class="fas fa-clock me-1"></i>Deletion pending admin approval
            </span>

            <!-- Request deletion (only if not already pending) -->
            <form th:unless="${deletionPending}"
                  th:action="@{/patches/{id}/request-delete(id=${patch.id})}" method="post" class="d-inline"
                  onsubmit="return confirm('Request deletion of this patch? An admin must approve before it is removed.')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-danger" style="opacity:0.85;">
                    <i class="fas fa-trash me-2"></i>Request Deletion
                </button>
            </form>
        </div>

        <div class="detail-grid">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="fas fa-shield-virus me-2"></i>
                        <span th:text="${patch.title}"></span>
                    </h2>
                    <span class="severity-badge"
                          th:classappend="'sev-' + ${patch.severity.name().toLowerCase()}"
                          th:text="${patch.severity}"></span>
                </div>
                <div class="card-body">
                    <div class="detail-rows">
                        <div class="detail-row">
                            <span class="detail-label">Patch ID</span>
                            <span class="detail-value patch-id" th:text="${patch.patchId}"></span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">OS Type</span>
                            <span class="detail-value">
                                <span th:if="${patch.osType.name() == 'WINDOWS'}" class="os-badge os-win"><i class="fab fa-windows me-1"></i>Windows</span>
                                <span th:if="${patch.osType.name() == 'LINUX'}" class="os-badge os-linux"><i class="fab fa-linux me-1"></i>Linux</span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Severity</span>
                            <span class="severity-badge"
                                  th:classappend="'sev-' + ${patch.severity.name().toLowerCase()}"
                                  th:text="${patch.severity}"></span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Reboot Required</span>
                            <span class="detail-value">
                                <span th:if="${patch.requiresReboot}" class="badge-warn"><i class="fas fa-triangle-exclamation me-1"></i>Yes</span>
                                <span th:unless="${patch.requiresReboot}" class="badge-ok">No</span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Release Date</span>
                            <span class="detail-value"
                                  th:text="${patch.releaseDate != null ? #temporals.format(patch.releaseDate,'dd MMM yyyy HH:mm') : 'N/A'}"></span>
                        </div>
                        <div class="detail-row" th:if="${patch.installCommand}">
                            <span class="detail-label">Install Command</span>
                            <span class="detail-value">
                                <code style="background:rgba(0,0,0,0.3);padding:2px 6px;border-radius:4px;font-size:0.85rem;"
                                      th:text="${patch.installCommand}"></code>
                            </span>
                        </div>
                        <!-- Manual file upload details -->
                        <div class="detail-row" th:if="${patch.filePath != null and !#strings.isEmpty(patch.filePath)}">
                            <span class="detail-label">Patch Binary</span>
                            <span class="detail-value">
                                <i class="fas fa-file-archive me-1" style="color:#28a745"></i>
                                <code style="font-size:0.85rem;"
                                      th:text="${#strings.substringAfterLast(patch.filePath,'_')}">patch.msu</code>
                                <span class="badge badge-success ms-2" style="font-size:0.75em">UPLOADED</span>
                            </span>
                        </div>
                        <div class="detail-row" th:if="${patch.deployPath != null and !#strings.isEmpty(patch.deployPath)}">
                            <span class="detail-label">Deploy Path</span>
                            <span class="detail-value">
                                <code style="background:rgba(0,0,0,0.3);padding:2px 6px;border-radius:4px;font-size:0.85rem;"
                                      th:text="${patch.deployPath}"></code>
                                <small style="color:#6c757d;margin-left:8px">on target server</small>
                            </span>
                        </div>
                        <div class="detail-row" th:if="${patch.description}">
                            <span class="detail-label">Description</span>
                            <span class="detail-value" th:text="${patch.description}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout :: footer}"></div>
</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
