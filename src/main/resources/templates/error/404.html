<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Not Found')}"></head>
<body class="app-layout">
<div th:replace="~{layout :: sidebar}"></div>
<main class="main-content">
    <div class="error-page">
        <div class="error-code">404</div>
        <div class="error-title">Resource Not Found</div>
        <div class="error-message" th:text="${errorMessage}">The requested resource was not found.</div>
        <div class="error-actions">
            <a href="/dashboard" class="btn btn-primary"><i class="fas fa-home me-2"></i>Go to Dashboard</a>
            <a href="javascript:history.back()" class="btn btn-ghost"><i class="fas fa-arrow-left me-2"></i>Go Back</a>
        </div>
    </div>
</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
